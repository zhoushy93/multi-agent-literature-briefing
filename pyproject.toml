[project]
name = "briefing"
version = "0.1.0"
description = "Multi-agent literature briefing system powered by DeepSeek"
requires-python = ">=3.11"

# Runtime dependencies are restricted to the whitelist in AGENTS.md §4.
# Adding a runtime dependency requires a decision record in docs/decisions/.
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pypdf>=4.2",
    "tenacity>=8.3",
    "weasyprint>=62",
]

[project.scripts]
briefing = "briefing.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# pypi.org is unreachable from this machine (see docs/decisions/002-package-index-mirror.md).
# Override with: uv sync --default-index https://pypi.org/simple
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/briefing"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Only lint/format real Python. Ruff >=0.16 otherwise tries to reformat the
# illustrative Python fences inside our Markdown design docs, which are
# hand-aligned on purpose.
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
# T20 bans bare print(): AGENTS.md §9 requires structured logging in library code.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "T20"]
# This project writes Chinese prose (report labels, prompts, fixtures).
# RUF001 flags full-width punctuation next to Latin text as "ambiguous"; these
# are the marks the report deliberately uses, so they are allowed explicitly
# instead of disabling the rule and losing its homoglyph protection.
allowed-confusables = [
    "，", "。", "：", "；", "、", "！", "？",
    "（", "）", "《", "》", "“", "”", "‘", "’",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

# WeasyPrint ships no type stubs; the renderer touches it through one tiny
# wrapper (`_load_weasyprint`) and is exercised by real PDF tests instead.
[[tool.mypy.overrides]]
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
    "live: tests that hit the real network and real LLM APIs (opt-in via RUN_LIVE_TESTS=1)",
]
